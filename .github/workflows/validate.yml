name: Validate GAIA Foundation

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/gaia-foundation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canon, editorial, regional data, and geometry
        run: python scripts/validate_gaia.py
      - name: Validate world-density phase 2
        run: python scripts/validate_phase2.py
      - name: Validate ecology integration phase 3
        run: python scripts/validate_phase3.py
      - name: Validate documentation and release integrity
        run: python scripts/validate_project_integrity.py
      - name: Verify deterministic public loader
        run: python scripts/build_public.py --check
      - name: Check Python scripts
        run: python -m compileall -q scripts
      - name: Check JavaScript syntax
        run: |
          cat src/app/*.js > /tmp/gaia-app.js
          node --check /tmp/gaia-app.js
          node --check public/app.js
          node --check public/data/canon.js
          node --check public/sw.js
          node --check playwright.config.js
          node --check tests/gaia-experience.spec.js
      - name: Check required public and assurance files
        run: |
          test -f public/index.html
          test -f public/styles.css
          test -f public/refinement.css
          test -f public/density.css
          test -f public/ecology.css
          test -f public/continuity.css
          test -f public/assets.css
          test -f public/assets/gaia-seal.svg
          test -f public/sw.js
          test -f public/data/canon/chunk-07.txt
          test -f public/data/canon-corrections.json
          test -f public/data/editorial/phase2.txt
          test -f public/data/editorial/phase3-01.txt
          test -f public/data/editorial/phase3-02.txt
          test -f src/app/02b-ecology-a.js
          test -f src/app/02b-ecology-b.js
          test -f src/app/02b-ecology-c.js
          test -f src/app/02b-ecology-d.js
          test -f src/app/02c-continuity.js
          test -f src/app/02d-assets.js
          test -f scripts/build_public.py
          test -f scripts/validate_phase3.py
          test -f scripts/phase3_validation_data.py
          test -f scripts/phase3_validation_checks.py
          test -f scripts/validate_project_integrity.py
          test -f package.json
          test -f playwright.config.js
          test -f tests/gaia-experience.spec.js
          test -f docs/VISUAL_ASSET_STRATEGY.md
          test -f docs/EXPERIENCE_ASSURANCE_PHASE.md

  experience:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned browser-assurance dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run desktop, mobile, reduced-motion, and accessibility assurance
        run: npm run test:experience
      - name: Upload browser reports and review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaia-experience-review-${{ github.run_number }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
