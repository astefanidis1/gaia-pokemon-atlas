name: Validate GAIA Foundation

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/gaia-foundation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canon, editorial, and regional data
        run: python scripts/validate_gaia.py
      - name: Verify deterministic source build
        run: python scripts/build_public.py --check
      - name: Reconstruct signed polished release
        run: python scripts/build_release_bundle.py --check
      - name: Compare source and signed release
        run: |
          cmp public/index.html dist/index.html
          cmp public/styles.css dist/styles.css
          cmp public/app.js dist/app.js
          cmp public/data/canon.js dist/data/canon.js
          cmp public/data/canon-corrections.json dist/data/canon-corrections.json
      - name: Check Python scripts
        run: python -m compileall -q scripts
      - name: Check JavaScript syntax
        run: |
          cat src/app/*.js > /tmp/gaia-app.js
          node --check /tmp/gaia-app.js
          node --check public/app.js
          node --check dist/app.js
          node --check dist/data/canon.js
      - name: Check required release files
        run: |
          test -f release/polished-public/manifest.json
          test -f release/polished-public/chunk-11.txt
          test -f dist/index.html
          test -f dist/styles.css
          test -f dist/assets/gaia-seal.svg
          test -f dist/data/canon/chunk-07.txt
          test -f dist/data/canon-corrections.json
          test -f dist/data/editorial/chunk-03.txt
          test -f dist/code/chunk-03.txt
