name: Deploy GAIA Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canon, editorial, and regional data
        run: python scripts/validate_gaia.py
      - name: Verify deterministic source build
        run: python scripts/build_public.py --check
      - name: Reconstruct signed polished release
        run: python scripts/build_release_bundle.py --check
      - name: Confirm signed release matches source
        run: |
          cmp public/index.html dist/index.html
          cmp public/styles.css dist/styles.css
          cmp public/app.js dist/app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
