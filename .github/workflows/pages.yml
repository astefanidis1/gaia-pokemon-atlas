name: Deploy GAIA Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canon, editorial, and regional data
        run: python scripts/validate_gaia.py
      - name: Verify deterministic public loader
        run: python scripts/build_public.py --check
      - name: Check service worker syntax
        run: node --check public/sw.js
      - name: Stage readable application source
        run: |
          mkdir -p public/source
          cp src/app/*.js public/source/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
